name: Build and test
on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Setup CUDA
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: '13.1.1'
        method: 'network'

    # NOTE: runtime tests need a GPU; we validate compilation here and run
    # the full make test on a local RTX 4060 (see README / local_test).
    - name: Build (compile only)
      shell: bash
      run: |
        ls /usr/local/cuda/lib64/libcudart* 2>/dev/null || echo "no cudart found"
        make build EXTRA_LIBS="/usr/local/cuda/lib64/libcudart.so"
